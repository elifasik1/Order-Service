name: OrderService CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      ConnectionStrings__Redis: "127.0.0.1:6379,abortConnect=false"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: OrderServiceTestDb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d OrderServiceTestDb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      - name: Apply migrations
        run: dotnet ef database update --project src/OrderService.Infrastructure --startup-project src/OrderService.API --connection "Host=localhost;Port=5432;Database=OrderServiceTestDb;Username=postgres;Password=postgres"

      - name: Test
        run: dotnet test --no-build

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker Image
        run: docker compose build api