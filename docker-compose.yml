services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=OrderServiceDb;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: orders-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: orders-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    container_name: orders-db
    environment:
      POSTGRES_DB: OrderServiceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - order_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d OrderServiceDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-api:
    build:
      context: .
      dockerfile: src/NotificationService.API/Dockerfile
    container_name: notification-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__NotificationConnection: "Host=postgres;Port=5432;Database=NotificationServiceDb;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  order_service_postgres_data:
    name: e78bba0868520ebdbe9efc7e08db82d4b84bee7a70dfdbd6101d4154789c863d