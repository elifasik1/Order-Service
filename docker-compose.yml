services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=OrderServiceDb;Username=postgres;Password=postgres"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: orders-db
    environment:
      POSTGRES_DB: OrderServiceDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - order_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d OrderServiceDb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  order_service_postgres_data:
    name: e78bba0868520ebdbe9efc7e08db82d4b84bee7a70dfdbd6101d4154789c863d