services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=OrderServiceDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-local-dev-only}"
      Jwt__SecretKey: "${JWT_SECRET:-local-development-jwt-secret-change-me}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: "${RABBITMQ_USER:-local-dev}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-local-dev-only}"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: orders-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: orders-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-local-dev}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-local-dev-only}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    container_name: orders-db
    environment:
      POSTGRES_DB: OrderServiceDb
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-dev-only}"
    ports:
      - "5432:5432"
    volumes:
      - order_service_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-notification-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d OrderServiceDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-api:
    build:
      context: .
      dockerfile: src/NotificationService.API/Dockerfile
    container_name: notification-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__NotificationConnection: "Host=postgres;Port=5432;Database=NotificationServiceDb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-local-dev-only}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: "${RABBITMQ_USER:-local-dev}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-local-dev-only}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  order_service_postgres_data:
    name: e78bba0868520ebdbe9efc7e08db82d4b84bee7a70dfdbd6101d4154789c863d